<!-- CODE-BLOCK / DIAGRAMA DE SETAS — pra mostrar direção de chamada, pipeline, fluxo.
     .row = uma linha "origem ──▶ destino" com comentário à direita.
     .blank = respiro entre grupos de linhas relacionadas.
     .cmd-line + .cmt-under = comando isolado com explicação embaixo (sem seta). -->
<section class="slide">
  <div class="slide-inner">
    <p class="eyebrow">__EYEBROW__</p>
    <h2 class="slide-title">__Título do fluxo__</h2>
    <p class="lede">__Uma frase resumindo a direção da comunicação.__</p>
    <div class="code-block">
      <div class="row"><span class="lhs"><span class="dir">__Origem__</span> <span class="via">──▶</span>  __ação/destino__</span><span class="cmt"># __comentário__</span></div>
      <div class="row"><span class="lhs"><span class="dir">__Origem__</span> <span class="via">──▶</span>  __ação/destino__</span><span class="cmt"># __comentário__</span></div>
      <div class="blank"></div>
      <div class="row"><span class="lhs"><span class="dir">__Outro grupo__</span> <span class="via">──▶</span>  __ação/destino__</span><span class="cmt"># __comentário__</span></div>
    </div>
  </div>
</section>
