<!-- PRINCIPLE CARDS — grid de 3 ou 4 conceitos lado a lado, sem hierarquia entre eles.
     Use pra "o que é X" / "os pilares de Y". Troque grid-4 por grid-3 se tiver só 3. -->
<section class="slide">
  <div class="slide-inner">
    <p class="eyebrow">__EYEBROW__</p>
    <h2 class="slide-title">__Título do conceito__</h2>
    <p class="lede">__Uma frase de contexto antes dos cartões.__</p>
    <div class="grid grid-4">
      <div class="card card--principle"><p class="card-title">__Conceito 1__</p><p class="card-desc">__Descrição em 1-2 frases.__</p></div>
      <div class="card card--principle"><p class="card-title">__Conceito 2__</p><p class="card-desc">__Descrição em 1-2 frases.__</p></div>
      <div class="card card--principle"><p class="card-title">__Conceito 3__</p><p class="card-desc">__Descrição em 1-2 frases.__</p></div>
      <div class="card card--principle"><p class="card-title">__Conceito 4__</p><p class="card-desc">__Descrição em 1-2 frases.__</p></div>
    </div>
  </div>
</section>
