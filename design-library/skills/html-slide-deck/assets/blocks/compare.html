<!-- COMPARE (ANTES/DEPOIS) — duas colunas, cada uma uma lista simples. Use pra mostrar
     o que mudou depois de um fix/refactor. A coluna "after" recebe destaque de cor no h4. -->
<section class="slide">
  <div class="slide-inner">
    <p class="eyebrow">__EYEBROW__</p>
    <h2 class="slide-title">__O que mudou__</h2>
    <p class="lede">__Contexto de uma frase.__</p>
    <div class="compare">
      <div class="card before">
        <h4>Antes</h4>
        <ul>
          <li>__problema 1__</li>
          <li>__problema 2__</li>
          <li>__problema 3__</li>
        </ul>
      </div>
      <div class="card after">
        <h4>Depois</h4>
        <ul>
          <li>__correção 1__</li>
          <li>__correção 2__</li>
          <li>__correção 3__</li>
        </ul>
      </div>
    </div>
  </div>
</section>
