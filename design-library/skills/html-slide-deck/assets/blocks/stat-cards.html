<!-- STAT CARDS — números grandes com um rótulo curto embaixo. Use pra "os números da prova".
     stat-num aceita qualquer string curta: "8 → 2", "1642", "+430 / −4455", "0". -->
<section class="slide">
  <div class="slide-inner">
    <p class="eyebrow">__EYEBROW__</p>
    <h2 class="slide-title">__Título__</h2>
    <div class="grid grid-4">
      <div class="card card--stat"><span class="stat-num">__123__</span><span class="stat-label">__o que esse número significa__</span></div>
      <div class="card card--stat"><span class="stat-num">__8 → 2__</span><span class="stat-label">__antes → depois__</span></div>
      <div class="card card--stat"><span class="stat-num">__+430 / −4455__</span><span class="stat-label">__linhas no diff__</span></div>
      <div class="card card--stat"><span class="stat-num">__0__</span><span class="stat-label">__regressões__</span></div>
    </div>
  </div>
</section>
