<!-- APP MOCK — frame de celular (100% HTML/CSS, sem imagem) em volta de uma tela mockada.
     Use pra mostrar um fluxo mobile. phone-row é a unidade repetível (linha de lista);
     phone-btn é a call-to-action; phone-tabbar é a barra inferior — marque a aba ativa com "active". -->
<section class="slide">
  <div class="slide-inner">
    <p class="eyebrow">__EYEBROW__</p>
    <h2 class="slide-title">__O que essa tela do app mostra__</h2>
    <p class="lede">__Contexto de uma frase.__</p>
    <div class="app-mock">
      <div class="phone">
        <div class="phone-screen">
          <div class="phone-notch"></div>
          <div class="phone-statusbar"><span>9:41</span><span>●●● ▂▄▆ 100%</span></div>
          <div class="phone-header">__Nome da tela__</div>
          <div class="phone-body">
            <div class="phone-row"><span class="label">__Item 1__</span><span class="value">__valor/estado__</span></div>
            <div class="phone-row"><span class="label">__Item 2__</span><span class="value">__valor/estado__</span></div>
            <div class="phone-row"><span class="label">__Item 3__</span><span class="value">__valor/estado__</span></div>
            <button type="button" class="phone-btn">__Ação principal__</button>
          </div>
          <div class="phone-tabbar">
            <span class="active">__Aba 1__</span><span>__Aba 2__</span><span>__Aba 3__</span>
          </div>
        </div>
      </div>
    </div>
    <p class="phone-caption">__Legenda opcional embaixo do celular.__</p>
  </div>
</section>
